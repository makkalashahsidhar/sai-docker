      - name: Validate Docker Hub secrets
        shell: bash
        env:
          DH_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DH_USERNAME" ]; then
            echo "Docker Hub username is missing"
            exit 1
          fi
          if [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub token is missing"
            exit 1
          fi
          if [[ "$DH_USERNAME" =~ [[:space:]] ]]; then
            echo "Username contains whitespace"
            exit 1
          fi
          if [[ "$DH_TOKEN" =~ [[:space:]] ]]; then
            echo "Token contains whitespace"
            exit 1
          fi
          echo "Both secrets are present; no whitespace detected."
